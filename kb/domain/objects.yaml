卡片:
  - 编号: D.order
    名称: 销售订单
    套: 行业
    层: 对象
    状态: 已封印
    关联:
      - D.item
    其下:
      - D.order.due_date
      - D.order.qty
      - D.order.unit
    别名: [销售单, SO]
    定义: 销售订单是按单交付的承诺载体，不是车间计划表。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 一张销售订单对应客户、品项、数量和约定日。
    说明: >
      行业对象，不是流程。订单上有约定日、数量、单位等槽。
      品项用关联，不做成订单的构成孩子。

  - 编号: D.order.due_date
    名称: 销售订单的客户约定日
    套: 行业
    层: 槽
    状态: 已封印
    定义: 销售订单有一个客户约定日，它不是计划完工日。
    属于: D.order
    类型: 日期
    必须有: 是
    别名: [due_date, 约定日, 交期]
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 订单上的交期是客户约定日。
    说明: >
      这是格子本身。后面主张、权责、改日、代码红线，谈的都是这一个槽。
      没有这个槽，不允许发明「交期」字段。

  - 编号: D.order.qty
    名称: 销售订单的数量
    套: 行业
    层: 槽
    状态: 假设
    定义: 销售订单有一个订货数量，进工时前必须先说到版。
    属于: D.order
    类型: 数量
    必须有: 是
    别名: [qty_order, 订货数]
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 订单数量先归到版再算工时。
    说明: >
      批次 D3 假设。运算禁令在许可 F.l3.normalize_to_board。

  - 编号: D.order.unit
    名称: 销售订单的单位
    套: 行业
    层: 槽
    状态: 假设
    定义: 销售订单上的订货单位，常见枚或盒。
    属于: D.order
    类型: 单位
    必须有: 是
    别名: [unit, 订货单位]
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 订货单位不是内部计量版。
    说明: >
      批次 D3 假设。换算走 D.uom_convert。

  - 编号: D.board
    名称: 版
    套: 行业
    层: 对象
    状态: 已封印
    是一种: D.uom
    别名: [board, BOARD]
    定义: 版是装饰件排产内部唯一计量单位。
    出处:
      - .cursorrules
      - 斯芬克斯-排程服务POC-开发需求规格.md
    对外怎么说:
      默认: 数量先归一到版。
    说明: >
      枚和盒如何换成版，写在许可 F.l3.normalize_to_board，不写进这条定义。

  - 编号: D.group
    名称: 组
    套: 行业
    层: 对象
    状态: 已封印
    其下:
      - D.calendar
    别名: [工作中心, group, group_code]
    定义: 组是手工组、模具组、浇注组，任务按组×日一行。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 任务按组×日一行。
    说明: >
      工作中心，不是货物规格。一部/二部是本厂编制，见运营 L2。
      规格曾写 SEMI 组码，代码是三个组码加 SEMI_DEPT。漂移记在投影。

  - 编号: D.sph
    名称: 品项在组上的标准小时产能
    套: 行业
    层: 对象
    状态: 已封印
    关联:
      - D.item
      - D.group
    其下:
      - D.sph.value
      - D.sph.basis
      - D.sph.crew
      - D.sph.uom
    别名: [SPH, sph, Standard Pieces per Hour, 标准小时产能]
    定义: SPH 是某装饰件品项在某组上的值、口径、标定人数、单位四元组。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 标准小时产能挂在品项和组两端，不是只属于品项。
    说明: >
      已取消单父属于。CREW 禁止再乘人数写在许可 F.l3.sph_and_hours。

  - 编号: D.sph.value
    名称: SPH 的值
    套: 行业
    层: 槽
    状态: 假设
    定义: 标准小时产能的数值。
    属于: D.sph
    类型: 数量
    必须有: 是
    别名: [sph_value]
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: SPH 值要换算到版/小时再除。
    说明: >
      批次 D2 假设。

  - 编号: D.sph.basis
    名称: SPH 的口径
    套: 行业
    层: 槽
    状态: 假设
    定义: SPH 口径是 SINGLE（一人一小时）或 CREW（一组配合一小时，人数已含在值内）。
    属于: D.sph
    类型: 枚举
    必须有: 是
    别名: [sph_basis, SINGLE, CREW]
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: CREW 表示人数已含在 SPH 值内。
    说明: >
      批次 D2 假设。「已含」是量的定义；禁止再乘是运营许可。

  - 编号: D.sph.crew
    名称: SPH 的标定人数
    套: 行业
    层: 槽
    状态: 假设
    定义: CREW 口径下标定的配合人数。
    属于: D.sph
    类型: 整数
    别名: [sph_crew]
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 投入人数与标定不符时标 E8。
    说明: >
      批次 D2 假设。

  - 编号: D.sph.uom
    名称: SPH 的单位
    套: 行业
    层: 槽
    状态: 假设
    定义: SPH 值所用的计量单位，运算前要换到版。
    属于: D.sph
    类型: 单位
    必须有: 是
    别名: [sph_uom]
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: SPH 单位经换算表变成版/小时。
    说明: >
      批次 D2 假设。

  - 编号: D.wo
    名称: 工单
    套: 行业
    层: 对象
    状态: 已封印
    关联:
      - D.order
      - D.item
    其下:
      - D.unplaced
      - D.wo_dep
      - D.wo_task
    别名: [WO, wo, Work Order]
    定义: 工单是按销售订单展开的生产指令，有成品与半成品两种。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 工单落成组日任务，不是改订单日期。
    说明: >
      先成品后半成品写在许可 F.l3.finished_then_semi。分类见 D.wo.finished / D.wo.semi。

  - 编号: D.wo.finished
    名称: 成品工单
    套: 行业
    层: 对象
    状态: 假设
    是一种: D.wo
    别名: [FINISHED]
    定义: 成品工单是做成装饰件、对客户交付的那种工单。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 一部做的是成品工单。
    说明: >
      批次 D3 假设。分类，不进工单的其下。

  - 编号: D.wo.semi
    名称: 半成品工单
    套: 行业
    层: 对象
    状态: 假设
    是一种: D.wo
    别名: [SEMI]
    定义: 半成品工单是为成品工单准备中间件的那种工单。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 二部做的是半成品工单。
    说明: >
      批次 D3 假设。分类，不进工单的其下。

  - 编号: D.dept
    名称: 一部成品与二部半成品
    套: 行业
    层: 对象
    状态: 假设
    定义: 斯芬克斯把制成按一部成品、二部半成品切开；这是本厂编制名，不是行业通用部门树。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 一部/二部是本厂叫法，能力在运营 L2。
    说明: >
      对应 Dept。已降出主林根。顾问绑制成应绑 D.wo.finished / D.wo.semi。
      卡片保留给覆盖台账挂枚举。

  - 编号: D.uom
    名称: 装饰件计量单位
    套: 行业
    层: 对象
    状态: 假设
    别名: [UoM, UOM, Unit of Measure, 枚, 盒, pcs, box]
    定义: 巧克力装饰件的计量枚举（枚/版/盒等）。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 参与运算的是枚、版、盒，不是通用 SI 单位。
    说明: >
      对应 Uom。换算链在 D.uom_convert。版是其中特权取值，见 D.board。

  - 编号: D.uom_convert
    名称: 装饰件品项的单位换算
    套: 行业
    层: 对象
    状态: 假设
    属于: D.item
    定义: 某装饰件品项上，枚/版/盒相邻两级的倍率必须走主数据表。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 这张单这个品项的换算走表。
    说明: >
      对应 UomConvert。禁止硬编码换算率是运营许可。

  - 编号: D.item
    名称: 装饰件品项
    套: 行业
    层: 对象
    状态: 假设
    关联:
      - D.group
    其下:
      - D.bom
      - D.item_route
      - D.uom_convert
    别名: [货物规格, 品项主数据, Item]
    定义: 可排产的巧克力装饰件主数据：销售单位、版盒比、损耗、默认走哪条组、要不要半成品。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 品项就是货物规格，不是再套一层父对象。
    说明: >
      对应 Item。默认组用关联，不把组成成品项孩子。

  - 编号: D.item_route
    名称: 装饰件品项的半成品路线
    套: 行业
    层: 对象
    状态: 假设
    属于: D.item
    别名: [工艺路线, Routing, ItemRoute]
    定义: 该品项倒排前是否要先做半成品、提前期几天、换线多久。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 要半成品的品项才展开 SEMI 工单。
    说明: >
      对应 ItemRoute。POC 不是完整工序树。

  - 编号: D.bom
    名称: 成品装饰件的子件
    套: 行业
    层: 对象
    状态: 假设
    属于: D.item
    别名: [BOM, bom, 物料清单, Bill of Materials]
    定义: 成品装饰件下一层：半成品要展开工单，糖纸等外购件只参与齐套占库。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 物料清单里外购件只齐套，不产工单。
    说明: >
      对应 BomLine 与 ComponentRole。

  - 编号: D.kit
    名称: 一次倒排的齐套占库
    套: 行业
    层: 运行结果
    状态: 假设
    属于: D.schedule_io
    别名: [齐套, Kitting, kit]
    定义: 一次倒排里按处理顺序给工单占半成品/外购件库存，记下缺口和齐套就绪日。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 这是本趟排程的占库快照，不是仓库台账。
    说明: >
      对应 Kit*。绑定的是排程运行，不是金蝶即时库存主档。

  - 编号: D.calendar
    名称: 组的工作日日历
    套: 行业
    层: 对象
    状态: 假设
    属于: D.group
    定义: 工作中心×日一行，含是否工作日和人数。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 只在工作日落位。
    说明: >
      对应 CalendarDay。

  - 编号: D.wo_task
    名称: 工单的组日任务
    套: 行业
    层: 对象
    状态: 假设
    属于: D.wo
    关联:
      - D.group
    其下:
      - D.coline
      - D.wo_task.hours_wall
      - D.wo_task.hours_man
    别名: [wo_task, 组日任务]
    定义: 任务是组×天一行。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 排程落在任务行，不是改订单日期。
    说明: >
      对应 WoTask。两个小时是槽，不写在这句散文里了事。

  - 编号: D.wo_task.hours_wall
    名称: 组日任务的墙钟工时
    套: 行业
    层: 槽
    状态: 假设
    定义: 墙钟是占日历的小时，用来排日程、看组日负荷。
    属于: D.wo_task
    类型: 小时
    必须有: 是
    别名: [hours_wall, 墙钟, 墙钟小时]
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 排程看墙钟，不拿它算工资。
    说明: >
      批次 D2 假设。禁止与人·时混用见 F.l3.sph_and_hours。

  - 编号: D.wo_task.hours_man
    名称: 组日任务的人·时
    套: 行业
    层: 槽
    状态: 假设
    定义: 人·时按墙钟乘投入人数，用来算成本。
    属于: D.wo_task
    类型: 人时
    必须有: 是
    别名: [hours_man, 人·时, 人时]
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 成本看人·时，三人干八小时是二十四人·时。
    说明: >
      批次 D2 假设。

  - 编号: D.wo_dep
    名称: 半成品工单对成品工单的依赖
    套: 行业
    层: 对象
    状态: 假设
    属于: D.wo
    定义: 半成品到成品是完成到开始，带提前期。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 半成品完工后成品才能开。
    说明: >
      对应 WoDependency。

  - 编号: D.conflict
    名称: 倒排计划的软约束冲突
    套: 行业
    层: 运行结果
    状态: 假设
    属于: D.schedule_io
    定义: 倒排或插单后标在工单/组日上的 E1–E10 提示（误期、齐套、人力等），只提示不阻断求解。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 这是排程冲突条，不是通用异常日志。
    说明: >
      对应 Conflict / ConflictLv。

  - 编号: D.unplaced
    名称: 工单在倒排中未放下的余量
    套: 行业
    层: 对象
    状态: 假设
    属于: D.wo
    定义: 某张成品或半成品工单还有整数版没在工作日里落下，并带最快可完成日。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 未放下的是工单版数，要给最快日，不能假装已排上。
    说明: >
      对应 Unplaced。

  - 编号: D.coline
    名称: 组日任务上的同品项并线
    套: 行业
    层: 对象
    状态: 假设
    属于: D.wo_task
    定义: 倒排结果里，同一工作中心同一天做同一装饰件、且来自至少两张销售单的落点。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 并线是排程标记，人确认后才算合批。
    说明: >
      对应 Coline* / LotSummary。第一批仍留主林。

  - 编号: D.insert
    名称: 已发布倒排上的插单
    套: 行业
    层: 运行结果
    状态: 假设
    属于: D.schedule_io
    定义: 在已发布的组日计划上再塞进一张销售单，须填原因和期望交期，并用四策略对比工单怎么挪。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 插的是进排程池的订单，不是任意单据插队。
    说明: >
      对应 Insert* 与 WoInsertLog。

  - 编号: D.plan_version
    名称: 倒排计划的版本
    套: 行业
    层: 运行结果
    状态: 假设
    属于: D.schedule_io
    其下:
      - D.diff
    别名: [plan_version]
    定义: 每一次正式倒排或插单应用后留下的计划快照编号，用来对比组日任务怎么变。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 比的是两版生产计划，不是文档版本。
    说明: >
      对应 PlanVersion 与 PlanTrigger。

  - 编号: D.schedule_io
    名称: 一次倒排运行
    套: 行业
    层: 运行结果
    状态: 假设
    其下:
      - D.conflict
      - D.feasibility
      - D.insert
      - D.kit
      - D.plan_version
      - D.trace
    定义: 跑一轮 JIT 倒排时的配置、订单、主数据、日历和产出的工单/任务/冲突。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 这是本趟算核信封，不是行业主数据。
    说明: >
      对应 ScheduleConfig / Input / Result / PriorityWeights。已改名去假从属。

  - 编号: D.diff
    名称: 倒排计划版本的工单差异
    套: 行业
    层: 运行结果
    状态: 假设
    属于: D.plan_version
    定义: 比较两个倒排计划版本后，各张工单是新增、挪日、延误、超交期还是被拿掉。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 差异说的是生产计划怎么变，不是代码 diff。
    说明: >
      对应 DiffEntry / DiffResult / ChangeType。

  - 编号: D.feasibility
    名称: 销售订单倒排的可行性
    套: 行业
    层: 运行结果
    状态: 假设
    属于: D.schedule_io
    关联:
      - D.order
    定义: 这张或这批销售单按无限产能倒排，能不能在客户约定日前落下；不行则判定不可行并给最快日。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 问的是交期倒排做不做得到，不是项目可研。
    说明: >
      对应 FeasibilityResult。不假装是订单的构成槽。

  - 编号: D.trace
    名称: 一次倒排的五幕回放
    套: 行业
    层: 运行结果
    状态: 假设
    属于: D.schedule_io
