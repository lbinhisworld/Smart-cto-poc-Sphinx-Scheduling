卡片:
  - 编号: F.l2.sales_owns_promise
    名称: 销售持有对外约定
    套: 运营
    层: 权责
    状态: 已封印
    命题: 交期承诺的所有者是销售与客户，不是排程算法。
    角色: 销售
    持有: 承诺
    可以:
      - 发起交期变更
    禁止:
      - 让引擎直接改约定
    演示数据: 是
    撑住谁:
      - F.l1.due_is_shared_reality
    绑哪个对象:
      - D.order.due_date
    出处:
      - packages/shared/auth.py
    对外怎么说:
      默认: 只有人能改约定；计划是响应，不是改写。
    说明: >
      约定日既然是对外承诺，所有者就是销售和客户关系，不是产能算法。
      演示角色来自现在的登录菜单，还不是正式组织权限。
