# 卡片栏名（给人看）。机器读取时按中文键，不在编辑视图暴露 spo/pack/claim。
# kb/__main__.py 只是 CLI 入口，不是卡片。
# 顺序：结构栏在上，说明永远在最后。

共用:
  - 编号
  - 名称
  - 套          # 运营 | 行业
  - 层          # 主张 | 权责 | 节点 | 投影 | 对象 | 槽 | 结论
  - 状态        # 已封印 | 假设
  - 命题        # 套=运营
  - 定义        # 套=行业
  - 何时成立
  - 何时不算
  - 撑住谁
  - 细化谁
  - 绑哪个对象
  - 禁止
  - 出处
  - 对外怎么说
  - 说明        # 整卡备注，必须最后

主张特化: [这根针, 为谁, 卖的是什么, 失败长什么样]
权责特化: [角色, 持有, 可以, 禁止, 演示数据]
节点特化: [何时触发, 谁有权, 只读, 可以写, 这一步禁止, 下一步, 业务规则]
投影特化: [落在哪个文件, 实现情况, 落实的是]
对象槽特化: [属于, 其下, 类型, 必须有]
# 行业提取：
# - 独立事物（销售订单、版、组、工单）可以单独成名。
# - 若 B 是 A 的特征/结果/槽，名称必须写成「A 的 B」，并填「属于: A」；禁止只提取 B。
#   例：倒排计划版本的工单差异，不是「计划差异」。
# - 卡片平铺。构成只靠边：子卡写「属于」，父卡写「其下」（与加载器按属于反查的孩子一致）。
# - 槽的编号必须是「父编号.后缀」。运营「绑哪个对象」仍指最小那张卡，不绑父对象冒充槽。
论证特化: [前提, 推出, 击败]
