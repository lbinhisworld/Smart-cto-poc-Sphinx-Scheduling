卡片:
  - 编号: D.order
    名称: 销售订单
    套: 行业
    层: 对象
    状态: 已封印
    其下:
      - D.order.due_date
      - D.feasibility
    定义: 销售订单是按单交付的承诺载体，不是车间计划表。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 一张销售订单对应客户、品项、数量和约定日。
    说明: >
      行业对象，不是流程。订单上有约定日、数量、单位等槽。
      运营节点谈改日、倒排、试算，都要绑到这张对象上的某个格子。

  - 编号: D.order.due_date
    名称: 销售订单的客户约定日
    套: 行业
    层: 槽
    状态: 已封印
    定义: 销售订单有一个客户约定日，它不是计划完工日。
    属于: D.order
    类型: 日期
    必须有: 是
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 订单上的交期是客户约定日。
    说明: >
      这是格子本身。后面主张、权责、改日、代码红线，谈的都是这一个槽。
      没有这个槽，不允许发明「交期」字段。

  - 编号: D.board
    名称: 版
    套: 行业
    层: 对象
    状态: 已封印
    定义: 版是系统内部唯一计量单位，枚和盒必须先换成版再算工时。
    出处:
      - .cursorrules
      - 斯芬克斯-排程服务POC-开发需求规格.md
    对外怎么说:
      默认: 数量先归一到版，禁止拿枚或盒直接除 SPH。
    说明: >
      第一期只点名对象。BR-01 的运算细节挂在倒排节点，不写进这条对象卡。

  - 编号: D.group
    名称: 组
    套: 行业
    层: 对象
    状态: 已封印
    其下:
      - D.calendar
    定义: 组是手工组、模具组、浇注组；二部与一部用部门区分，不是第四个组码。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 任务按组×日一行。
    说明: >
      规格曾写 SEMI 组码，代码是三个组码加 SEMI_DEPT。漂移记在投影，不在这里改引擎。

  - 编号: D.sph
    名称: 品项在组上的标准小时产能
    套: 行业
    层: 对象
    状态: 已封印
    属于: D.item
    定义: SPH 是某装饰件品项在某组上的值、口径、人数、单位四元组；CREW 口径下人数已含在值内。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: CREW 口径禁止再乘人数。
    说明: >
      第一期只点名。口径规则由对应节点和红线落实，不在对象卡里写算法。

  - 编号: D.wo
    名称: 工单
    套: 行业
    层: 对象
    状态: 已封印
    其下:
      - D.unplaced
      - D.wo_dep
      - D.wo_task
    定义: 工单分成品与半成品，先排成品再排半成品。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 成品变动要重建半成品工单。
    说明: >
      第一期只点名对象。先成品后半成品是节点规则（BR-34），不写进对象定义本身。

  - 编号: D.dept
    名称: 一部成品与二部半成品
    套: 行业
    层: 对象
    状态: 假设
    定义: 斯芬克斯排产按两个部门切开：一部做成品装饰件，二部做半成品，不是通用公司部门树。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 二部不是第四个组码，是半成品部门挂同一套组。
    说明: >
      对应 Dept。和组码一起定位「哪个厂区的哪条组」，不要理解成行政编制。

  - 编号: D.uom
    名称: 装饰件计量单位
    套: 行业
    层: 对象
    状态: 假设
    定义: 巧克力装饰件的计量枚举（枚/版/盒等），倒排工时只认先换成版之后的数量。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 参与运算的是枚、版、盒，不是通用 SI 单位。
    说明: >
      对应 Uom。换算链在 D.uom_convert，不是任意行业的 UOM。

  - 编号: D.uom_convert
    名称: 装饰件品项的单位换算
    套: 行业
    层: 对象
    状态: 假设
    属于: D.item
    定义: 某装饰件品项上，枚/版/盒相邻两级的倍率必须走主数据表，倒排禁止写死换算。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 这张单这个品项的换算走表。
    说明: >
      对应 UomConvert。不是通用单位换算库。

  - 编号: D.item
    名称: 装饰件品项
    套: 行业
    层: 对象
    状态: 假设
    其下:
      - D.bom
      - D.item_route
      - D.sph
      - D.uom_convert
    定义: 可排产的巧克力装饰件主数据：销售单位、版盒比、损耗、走哪条组、要不要半成品。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 品项决定走一部哪条组和要不要二部半成品。
    说明: >
      对应 Item。不是电商 SKU 泛化。

  - 编号: D.item_route
    名称: 装饰件品项的半成品路线
    套: 行业
    层: 对象
    状态: 假设
    属于: D.item
    定义: 该品项倒排前是否要先做二部半成品、提前期几天、换线多久。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 要半成品的品项才展开 SEMI 工单。
    说明: >
      对应 ItemRoute。POC 不是完整工序树。

  - 编号: D.bom
    名称: 成品装饰件的子件
    套: 行业
    层: 对象
    状态: 假设
    属于: D.item
    定义: 成品装饰件下一层：半成品要展开工单，糖纸等外购件只参与齐套占库。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 外购件只齐套，不产工单。
    说明: >
      对应 BomLine 与 ComponentRole。

  - 编号: D.kit
    名称: 一次倒排的齐套占库
    套: 行业
    层: 对象
    状态: 假设
    属于: D.schedule_io
    定义: 一次倒排里按处理顺序给工单占半成品/外购件库存，记下缺口和齐套就绪日。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 这是本趟排程的占库快照，不是仓库台账。
    说明: >
      对应 Kit*。绑定的是排程运行，不是金蝶即时库存主档。

  - 编号: D.calendar
    名称: 组的工作日日历
    套: 行业
    层: 对象
    状态: 假设
    属于: D.group
    定义: 工作中心×日一行，含是否工作日和人数。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 只在工作日落位。
    说明: >
      对应 CalendarDay。

  - 编号: D.wo_task
    名称: 工单的组日任务
    套: 行业
    层: 对象
    状态: 假设
    属于: D.wo
    其下:
      - D.coline
    定义: 任务是组×天一行，同时记下墙钟与人·时。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 排程落在任务行，不是改订单日期。
    说明: >
      对应 WoTask。

  - 编号: D.wo_dep
    名称: 半成品工单对成品工单的依赖
    套: 行业
    层: 对象
    状态: 假设
    属于: D.wo
    定义: 半成品到成品是完成到开始，带提前期。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 半成品完工后成品才能开。
    说明: >
      对应 WoDependency。

  - 编号: D.conflict
    名称: 倒排计划的软约束冲突
    套: 行业
    层: 对象
    状态: 假设
    属于: D.schedule_io
    定义: 倒排或插单后标在工单/组日上的 E1–E10 提示（误期、齐套、人力等），只提示不阻断求解。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 这是排程冲突条，不是通用异常日志。
    说明: >
      对应 Conflict / ConflictLv。不是代码冲突、不是人际冲突。

  - 编号: D.unplaced
    名称: 工单在倒排中未放下的余量
    套: 行业
    层: 对象
    状态: 假设
    属于: D.wo
    定义: 某张成品或半成品工单还有整数版没在工作日里落下，并带最快可完成日。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 未放下的是工单版数，要给最快日，不能假装已排上。
    说明: >
      对应 Unplaced。不是「待办未处理」那种泛未安置。

  - 编号: D.coline
    名称: 组日任务上的同品项并线
    套: 行业
    层: 对象
    状态: 假设
    属于: D.wo_task
    定义: 倒排结果里，同一工作中心同一天做同一装饰件、且来自至少两张销售单的落点。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 并线是排程标记，人确认后才算合批。
    说明: >
      对应 Coline* / LotSummary。不是铁路共线，也不是通用合并单元格。

  - 编号: D.insert
    名称: 已发布倒排上的插单
    套: 行业
    层: 对象
    状态: 假设
    属于: D.schedule_io
    定义: 在已发布的组日计划上再塞进一张销售单，须填原因和期望交期，并用四策略对比工单怎么挪。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 插的是进排程池的订单，不是任意单据插队。
    说明: >
      对应 Insert* 与 WoInsertLog。

  - 编号: D.plan_version
    名称: 倒排计划的版本
    套: 行业
    层: 对象
    状态: 假设
    属于: D.schedule_io
    其下:
      - D.diff
    定义: 每一次正式倒排或插单应用后留下的计划快照编号，用来对比组日任务怎么变。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 比的是两版生产计划，不是文档版本。
    说明: >
      对应 PlanVersion 与 PlanTrigger。

  - 编号: D.schedule_io
    名称: 一次倒排的输入输出
    套: 行业
    层: 对象
    状态: 假设
    其下:
      - D.conflict
      - D.insert
      - D.kit
      - D.plan_version
      - D.trace
    定义: 跑一轮 JIT 倒排时的配置、订单、主数据、日历和产出的工单/任务/冲突。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 栅栏和权重读配置，是这趟排程的边界，不是通用 API 信封。
    说明: >
      对应 ScheduleConfig / Input / Result / PriorityWeights。

  - 编号: D.diff
    名称: 倒排计划版本的工单差异
    套: 行业
    层: 对象
    状态: 假设
    属于: D.plan_version
    定义: 比较两个倒排计划版本后，各张工单是新增、挪日、延误、超交期还是被拿掉。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 差异说的是生产计划怎么变，不是代码 diff。
    说明: >
      对应 DiffEntry / DiffResult / ChangeType。必须绑倒排计划版本，
      不要理解成任意「计划」或 Git 差异。

  - 编号: D.feasibility
    名称: 销售订单倒排的可行性
    套: 行业
    层: 对象
    状态: 假设
    属于: D.order
    定义: 这张或这批销售单按无限产能倒排，能不能在客户约定日前落下；不行则判定不可行并给最快日。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 问的是交期倒排做不做得到，不是项目可研。
    说明: >
      对应 FeasibilityResult。对象是履约倒排，不是投资可行性。

  - 编号: D.trace
    名称: 一次倒排的五幕回放
    套: 行业
    层: 对象
    状态: 假设
    属于: D.schedule_io
    定义: 一次倒排过程按展开、排队、落位、半成品、检查五幕记下的事件，用来讲解本趟怎么排。
    出处: [packages/engine/models.py]
    对外怎么说:
      默认: 过程气泡来自这趟倒排日志，不是调试器调用栈。
    说明: >
      对应 Trace* 与 TraceAct。
