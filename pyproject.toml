[project]
name = "sphinx-scheduling-poc"
version = "0.2.0"
description = "斯芬克斯一体化演示 POC"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
engine = "packages/engine"
shared = "packages/shared"
sealed_kb = "packages/sealed_kb"

[tool.setuptools.packages.find]
include = ["engine*", "api*", "db*", "shared*", "sealed_kb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages"]

[tool.coverage.run]
source = ["packages/engine"]
branch = true
