卡片:
  - 编号: F.l3.due_change_via_approval
    名称: 改约定必须走变更审批
    套: 运营
    层: 节点
    状态: 已封印
    这句话: 只有变更审批通过，才允许改订单约定日。
    何时触发: 客户要改约定，或协商后双方同意新日子
    谁有权:
      - 销售
      - 销售总监
      - 总经理
    只读:
      - D.order.due_date
      - 最快可交日
    可以写:
      - D.order.due_date
    这一步禁止:
      - 排程发布
      - 倒排求解
      - 交期试算里改日
    下一步: 重排时被改的单先占位
    业务规则:
      - BR-27
      - BR-47
    撑住谁:
      - F.l2.sales_owns_promise
    绑哪个对象:
      - D.order.due_date
    出处:
      - .cursorrules
    对外怎么说:
      默认: 要改日子，走变更审批；试算只给最快可交日。
    说明: >
      日常里若要改订单上的约定日，只能走订单变更并且审批通过。
      倒排、发布、交期试算都没有写约定日的许可。
