卡片:
  - 编号: F.l1.due_is_shared_reality
    名称: 交期是双方唯一的共同约定
    套: 运营
    层: 主张
    状态: 已封印
    命题: 按单、无成品仓时，客户交期是销售与工厂唯一共享的约定。
    这根针: 履约
    为谁: 客户与销售
    卖的是什么: 按约定日交付的巧克力装饰，不是库存现货
    失败长什么样: 双方没有共同对象可争、可算、可认输
    何时成立:
      - 按单
      - 无备货
      - 有客户约定
    何时不算:
      - 内部返工
    绑哪个对象:
      - D.order.due_date
    出处:
      - 斯芬克斯-排程服务POC-开发需求规格.md
    对外怎么说:
      销售: 斯芬克斯订单的交期是对外约定，不是车间自己定的完工日。
      默认: 斯芬克斯订单的交期是对外约定，不是车间自己定的完工日。
      生管: 倒排必须从这张约定往回排，不能另起一个希望完工日。
    说明: >
      这一层说的是生意本身，不是哪段代码。斯芬克斯按单做、没有成品仓，
      销售和工厂能共同认的只有订单上的客户约定日。内部返工、从未约定
      过日子时，这条不算。它绑的是「订单.约定日」这个对象槽。

  - 编号: F.l1.board_is_meter
    名称: 版是内部唯一计量
    套: 运营
    层: 主张
    状态: 已封印
    命题: 工时和产能必须先说到版，枚和盒不能直接当产能单位。
    这根针: 履约
    为谁: 计划与车间
    卖的是什么: 按版组织的装饰件生产
    失败长什么样: 拿盒或枚去除 SPH，工时整体偏掉
    绑哪个对象:
      - D.board
    出处:
      - .cursorrules
    对外怎么说:
      默认: 数量先归一到版，禁止拿枚或盒直接除 SPH。
    说明: >
      从属尺子，不是履约价值流的主叙事。许可 F.l3.normalize_to_board 撑住它，
      并属于需求环节。换算公式不写进这条主张。

  - 编号: F.l1.crew_in_sph
    名称: CREW 口径人数已在 SPH 内
    套: 运营
    层: 主张
    状态: 已封印
    命题: 多人配合的 SPH 已经含人数，再乘人数会把产能算假。
    这根针: 履约
    为谁: 计划
    卖的是什么: 按组配合的标准小时产能
    失败长什么样: CREW 再乘人数，工时腰斩或翻倍
    绑哪个对象:
      - D.sph
    出处:
      - .cursorrules
    对外怎么说:
      默认: CREW 口径禁止再乘人数。
    说明: >
      倒排环节下的许可叙事，不是履约价值流的主叙事。许可 F.l3.sph_and_hours
      撑住它。SINGLE 口径才按人数放大组速。

  - 编号: F.l1.mto_no_fg_stock
    名称: 按单交付装饰件、不设成品仓
    套: 运营
    层: 主张
    状态: 已封印
    命题: 装饰件按订单交付，工厂不设成品仓、不靠库存现货兑现约定。
    这根针: 履约
    为谁: 客户与销售
    卖的是什么: 按约定日交付的巧克力装饰，不是库存现货
    失败长什么样: 没有成品可挪用，约定失守就只能重谈
    何时成立:
      - 按单
      - 无备货
    别名: [MTO, Make to Order, 按单生产]
    绑哪个对象:
      - D.order.due_date
    出处:
      - 斯芬克斯-排程服务POC-开发需求规格.md
    对外怎么说:
      默认: 按单做、没有成品仓，交得出去靠约定日而不是现货。
    说明: >
      规格 §1 已写按单生产、无备货。命题不写仓储工艺原因。
      批次 O5 已封印。可与交期锚共同兑现多条价值流，不要求一主张一流。
