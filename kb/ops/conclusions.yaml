卡片:
  - 编号: C.give_earliest_keep_due
    名称: 只给最快可交、不改约定日
    套: 运营
    层: 结论
    状态: 已封印
    这句话: 交期冲突时只给出最快可交日，不改订单上的约定日。
    何时成立:
      - 按单
      - 无备货
      - 有客户约定
      - E2
    绑哪个对象:
      - D.order.due_date
    禁止:
      - 写回订单约定日
    对外怎么说:
      销售: 二部来不及也只能谈新约定；系统不会改订单日期。
      生管: 先回最快可交日给销售，不要改这张单的约定日。
      默认: 只给最快可交日，不会改订单日期。
    说明: >
      这是顾问对「E2 了能不能改交期」的结论卡。它被交期锚一条论证键推出，
      不是单独的主张。
