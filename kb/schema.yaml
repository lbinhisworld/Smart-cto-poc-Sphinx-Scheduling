# 卡片栏名（给人看）。机器读取时按中文键，不在编辑视图暴露 spo/pack/claim。
# kb/__main__.py 只是 CLI 入口，不是卡片。
# 顺序：结构栏在上，说明永远在最后。

共用:
  - 编号
  - 名称
  - 套          # 运营 | 行业
  - 层          # 主张 | 权责 | 价值流 | 环节 | 节点 | 投影 | 对象 | 槽 | 运行结果 | 结论
  - 状态        # 已封印 | 假设
  - 命题        # 套=运营
  - 定义        # 套=行业
  - 何时成立
  - 何时不算
  - 撑住谁
  - 细化谁
  - 属于        # 构成；进其下
  - 关联        # 多端；不进其下
  - 是一种      # 分类；不进其下
  - 别名        # 缩写与英文展开
  - 其下
  - 绑哪个对象
  - 禁止
  - 出处
  - 对外怎么说
  - 说明        # 整卡备注，必须最后

主张特化: [这根针, 为谁, 卖的是什么, 失败长什么样]
权责特化: [角色, 持有, 可以, 禁止, 演示数据]
价值流特化: [属于, 其下]
环节特化: [属于, 其下, 谁有权, 阶段产出]
节点特化: [何时触发, 谁有权, 只读, 可以写, 这一步禁止, 下一步, 业务规则]
投影特化: [落在哪个文件, 实现情况, 落实的是]
对象槽特化: [属于, 关联, 是一种, 别名, 其下, 类型, 必须有]
# 行业提取：见 客户会议反馈/行业本体提取-升级方案.md
# - 主林=对象/槽（格子与量纲）。运行结果林=一次倒排切片。不要抬货物规格当父。
# - 属于=构成（进其下）。关联=多端（不进其下）。是一种=分类。
# - 有属于则名称须是「A 的 B」。无属于的对象进独立名单；运行结果根单独登记。
# - 槽编号「父.后缀」。运营绑最小槽。缩写写别名，不另开缩写卡。
论证特化: [前提, 推出, 击败]
