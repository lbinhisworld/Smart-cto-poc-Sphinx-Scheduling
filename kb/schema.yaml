# 卡片栏名（给人看）。机器读取时按中文键，不在编辑视图暴露 spo/pack/claim。
# kb/__main__.py 只是 CLI 入口，不是卡片。
# 顺序：结构栏在上，说明永远在最后。

共用:
  - 编号
  - 名称
  - 套          # 运营 | 行业
  - 层          # 主张 | 权责 | 节点 | 投影 | 对象 | 槽 | 结论
  - 状态        # 已封印 | 假设
  - 这句话
  - 何时成立
  - 何时不算
  - 撑住谁
  - 细化谁
  - 绑哪个对象
  - 禁止
  - 出处
  - 对外怎么说
  - 说明        # 整卡备注，必须最后

主张特化: [这根针, 为谁, 卖的是什么, 失败长什么样]
权责特化: [角色, 持有, 可以, 禁止, 演示数据]
节点特化: [何时触发, 谁有权, 只读, 可以写, 这一步禁止, 下一步, 业务规则]
投影特化: [落在哪个文件, 实现情况, 落实的是]
对象槽特化: [属于, 类型, 必须有]
论证特化: [前提, 推出, 击败]
