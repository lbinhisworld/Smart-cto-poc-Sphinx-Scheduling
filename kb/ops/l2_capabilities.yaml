卡片:
  - 编号: F.l2.cap_plan
    名称: 计划的倒排与可承诺能力
    套: 运营
    层: 权责
    状态: 假设
    命题: 计划持有从约定日倒排、齐套锁定和给出最快可交日的能力。
    别名: [PMC, 生管, Production & Material Control]
    角色: 计划
    持有: 倒排与可承诺
    可以:
      - 编制贴约定日的计划
      - 回最快可交日
    禁止:
      - 让引擎写回约定日
    撑住谁:
      - F.l1.due_is_shared_reality
      - F.l1.mto_no_fg_stock
    绑哪个对象:
      - D.order.due_date
    出处:
      - 斯芬克斯-排程服务POC-开发需求规格.md
    对外怎么说:
      默认: 计划从约定往回排，做不到就回最快日，不改锚。PMC 是本厂对这套生管职能的通用叫法，不是行业物理对象。
    说明: >
      批次 O3 假设。名称是职能的权责，不写成已确认的部门编制。
      别名 PMC/生管给人问「PMC 是什么」。登录号仍是演示角色卡。

  - 编号: F.l2.cap_dept1
    名称: 一部的成品制成能力
    套: 运营
    层: 权责
    状态: 假设
    命题: 一部按倒排工单做成装饰件成品，按组日任务报工。
    角色: 一部
    持有: 成品制成
    撑住谁:
      - F.l1.mto_no_fg_stock
    绑哪个对象:
      - D.wo.finished
    出处:
      - 斯芬克斯-排程服务POC-开发需求规格.md
    对外怎么说:
      默认: 一部做客户要的成品，不另起一套交期。
    说明: >
      批次 O3 假设。绑成品工单分类，不绑编制卡 D.dept。

  - 编号: F.l2.cap_dept2
    名称: 二部的半成品制成能力
    套: 运营
    层: 权责
    状态: 假设
    命题: 二部按成品倒推的半成品工单制成，不另定对外约定。
    角色: 二部
    持有: 半成品制成
    撑住谁:
      - F.l1.mto_no_fg_stock
    绑哪个对象:
      - D.wo.semi
    出处:
      - 斯芬克斯-排程服务POC-开发需求规格.md
    对外怎么说:
      默认: 二部做半成品，跟成品工单走，不是第四个组码。
    说明: >
      批次 O3 假设。禁止把规格没有的组名写进这张卡。

  - 编号: F.l2.cap_kit
    名称: 仓储的齐套占库能力
    套: 运营
    层: 权责
    状态: 假设
    命题: 仓储按处理顺序占库，缺料先提示，不改订单约定日。
    角色: 仓储
    持有: 齐套占库
    撑住谁:
      - F.l1.mto_no_fg_stock
    绑哪个对象:
      - D.kit
    出处:
      - packages/engine/kitting.py
    对外怎么说:
      默认: 齐套不够先标出来，默认不拿缺料改约定。
    说明: >
      批次 O3 假设。可选能力，挂倒排环节的齐套许可。
