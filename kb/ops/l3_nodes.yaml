卡片:
  - 编号: F.l3.due_change_via_approval
    名称: 改约定必须走变更审批
    套: 运营
    层: 节点
    状态: 已封印
    命题: 只有变更审批通过，才允许改订单约定日。
    何时触发: 客户要改约定，或协商后双方同意新日子
    谁有权:
      - 销售
      - 销售总监
      - 总经理
    只读:
      - D.order.due_date
      - 最快可交日
    可以写:
      - D.order.due_date
    这一步禁止:
      - 排程发布
      - 倒排求解
      - 交期试算里改日
    下一步: 重排时被改的单先占位
    业务规则:
      - BR-27
      - BR-47
    属于: F.l3.stg.demand
    撑住谁:
      - F.l2.sales_owns_promise
    绑哪个对象:
      - D.order.due_date
    出处:
      - .cursorrules
    对外怎么说:
      默认: 如果需要修改交期，必须双方协商后由销售走变更审批；试算只给最快可交日。
    说明: >
      日常里若要改订单上的约定日，只能走订单变更并且审批通过。
      倒排、发布、交期试算都没有写约定日的许可。

  - 编号: F.l3.normalize_to_board
    名称: 数量先归到版再算
    套: 运营
    层: 节点
    状态: 已封印
    命题: 展开与工时计算必须走换算表，先得到整数版，禁止硬编码换算率。
    业务规则: [BR-01, BR-02, BR-03, BR-04, BR-05]
    属于: F.l3.stg.demand
    撑住谁:
      - F.l1.board_is_meter
    绑哪个对象:
      - D.board
      - D.uom_convert
    出处:
      - packages/engine/uom.py
    对外怎么说:
      默认: 先换成版，再除 SPH。
    说明: >
      计量链的许可动作。主张是「版是尺子」；这里规定怎么换。

  - 编号: F.l3.sph_and_hours
    名称: SPH 口径与两个小时
    套: 运营
    层: 节点
    状态: 已封印
    命题: CREW 不再乘人数；墙钟用来排日程，人·时用来算成本，禁止混用。
    业务规则: [BR-10, BR-11, BR-12, BR-13, BR-14]
    属于: F.l3.stg.schedule
    撑住谁:
      - F.l1.crew_in_sph
    绑哪个对象:
      - D.sph
      - D.wo_task.hours_wall
      - D.wo_task.hours_man
    出处:
      - packages/engine/capacity.py
    对外怎么说:
      默认: CREW 口径禁止再乘人数；排程看墙钟，成本看人·时。
    说明: >
      产能与工时的许可算法。人数超编制在前端拦截，不在这里发明新口径。

  - 编号: F.l3.finished_then_semi
    名称: 先成品后半成品
    套: 运营
    层: 节点
    状态: 假设
    命题: 必须先排成品再排半成品；成品一动，半成品工单整批重建。
    业务规则: [BR-30, BR-31, BR-32, BR-33, BR-34, BR-35, BR-36, BR-37]
    属于: F.l3.stg.schedule
    绑哪个对象:
      - D.wo
    出处:
      - packages/engine/expand.py
    对外怎么说:
      默认: 成品变动要重建半成品工单。
    说明: >
      批次 C 假设卡。库存扣减与多行 BOM 细节见齐套节点。

  - 编号: F.l3.kitting
    名称: 齐套占库
    套: 运营
    层: 节点
    状态: 假设
    命题: 运行内按处理顺序占库；缺料默认只提示，STRICT 才推后开工。
    业务规则: [BR-32b, BR-38, BR-39, BR-39b]
    属于: F.l3.stg.schedule
    绑哪个对象:
      - D.kit
    出处:
      - packages/engine/kitting.py
    对外怎么说:
      默认: 齐套不足先标冲突，默认不阻断排产。
    说明: >
      批次 C/E 交界。外购件不生成工单，只参与齐套。

  - 编号: F.l3.backward_place
    名称: 从约定日倒排落位
    套: 运营
    层: 节点
    状态: 假设
    命题: 倒排从约定日往回填工作日，默认交期晚的先占位；插单切 PIN_FIRST。
    别名: [JIT, Just in Time, 倒排]
    业务规则: [BR-20, BR-21, BR-22, BR-23, BR-24, BR-25, BR-26]
    属于: F.l3.stg.schedule
    撑住谁:
      - F.l1.due_is_shared_reality
    绑哪个对象:
      - D.order.due_date
      - D.wo_task
    出处:
      - packages/engine/backward.py
    对外怎么说:
      默认: 从交期当天往回排，不要改成紧急单升序当默认。
    说明: >
      批次 D 假设卡。锁定工单不重排但占容量。

  - 编号: F.l3.fence_ripple
    名称: 栅栏涟漪与死区
    套: 运营
    层: 节点
    状态: 假设
    命题: 禁止默认全量重排；冻结区、死区、涟漪上限和权重都读配置。
    别名: [时间栅栏, 冻结区, 涟漪, 死区, what-if]
    业务规则: [BR-40, BR-41, BR-42, BR-43, BR-44, BR-45, BR-46]
    属于: F.l3.stg.schedule
    绑哪个对象:
      - D.schedule_io
    出处:
      - config/schedule.yaml
    对外怎么说:
      默认: 插单走时间栅栏，不要一键全厂重排。
    说明: >
      批次 D 假设卡。参数键挂在配置资产上，不写死数字。

  - 编号: F.l3.soft_conflicts
    名称: 冲突只提示并给最快日
    套: 运营
    层: 节点
    状态: 假设
    命题: E1–E10 都是软约束；物理不可行必须判定并给最快可交日，禁止硬排做不到的计划。
    业务规则: [BR-47, BR-50]
    属于: F.l3.stg.fulfill
    撑住谁:
      - F.l1.due_is_shared_reality
    绑哪个对象:
      - D.conflict
    出处:
      - packages/engine/conflicts.py
    对外怎么说:
      默认: 冲突只提示不阻断；做不到就给最快日，不假装排上。
    说明: >
      批次 E 假设卡。覆盖冲突码 E1–E10。
