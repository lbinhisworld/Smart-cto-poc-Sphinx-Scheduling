卡片:
  - 编号: F.l3.attendance_cap
    名称: 报工工时受考勤上限约束
    套: 运营
    层: 节点
    状态: 假设
    命题: 组×日报工人·时不得超过当日该组考勤上限；无考勤记录则拒绝确认。
    属于: F.l3.stg.make
    谁有权:
      - F.l2.cap_dept1
      - F.l2.cap_dept2
    这一步禁止:
      - 无考勤确认报工
    绑哪个对象:
      - D.wo_task
    出处:
      - docs/POC范围说明.md
    对外怎么说:
      默认: 报工不能超过当天考勤上限。
    说明: >
      批次 O4 假设。出处是 POC 防虚报，不发明新的考勤系统。

  - 编号: F.l3.unfinished_to_pool
    名称: 未完数量回待排池
    套: 运营
    层: 节点
    状态: 假设
    命题: 欠产进待确认池，不改订单交期，不自动次日重排。
    属于: F.l3.stg.make
    谁有权:
      - F.l2.cap_plan
    禁止:
      - 写回订单约定日
    这一步禁止:
      - 自动次日重排
      - 写回订单约定日
    撑住谁:
      - F.l1.due_is_shared_reality
    绑哪个对象:
      - D.wo
    出处:
      - docs/POC范围说明.md
    对外怎么说:
      默认: 没做完的回池，日子仍是原来的约定。
    说明: >
      批次 O4 假设。POC：计划 100 / 完工 80 → 剩余进待确认池。

  - 编号: F.l3.sup.sample
    名称: 打样闭环支撑
    套: 运营
    层: 节点
    状态: 假设
    命题: 打样只支撑需求确认，不是第二条价值主张或价值流。
    属于: F.l3.stg.demand
    谁有权:
      - 研发填打样成本
      - 财务出对客报价
      - 业务与销管看对客报价金额
    禁止:
      - 研发见对客报价
      - 销管见打样成本
      - 业务见打样成本
    这一步禁止:
      - 接口把打样成本发给业务或销管
      - 接口把对客报价发给研发
      - 另开报价规则许可
    出处:
      - docs/POC范围说明.md
      - 客户会议反馈/第二次演示后-完整升级方案.md
    对外怎么说:
      默认: 打样挂在需求环节下；研发不见对客报价，销管不见打样成本。
    说明: >
      批次 O4 支撑假设，二演后补列级权限。不得无出处升成新主张；
      要另开价值流必须先有主张。报价规则表未到，不建算价许可。

  - 编号: F.l3.sup.payment
    名称: 合同回款支撑
    套: 运营
    层: 节点
    状态: 假设
    命题: 回款是履约关闭的支撑，规格不足不建催收许可。
    属于: F.l3.stg.fulfill
    出处:
      - docs/POC范围说明.md
    对外怎么说:
      默认: 回款先记缺口，不编催收规则。
    说明: >
      批次 O4 支撑假设。缺口。不得无出处升成新主张；要另开价值流必须先有主张。
