# 二演后履约叶子（皆假设）。复用已封印 L1 与按单履约流，不另开主张或价值流。
卡片:
  - 编号: F.l3.earliest_whatif
    名称: 最快方案只做 what-if
    套: 运营
    层: 节点
    状态: 假设
    命题: 交期排不下时另做一次最快日试排，只当提案，不发布、不改约定日。
    别名: [最快方案, 最快可交方案]
    何时触发: 本轮倒排未安置完或半成品赶不上，且最快可完成日晚于客户交期
    谁有权:
      - F.l2.cap_plan
      - F.l2.sales_owns_promise
    只读:
      - D.order.due_date
      - 最快可交日
    这一步禁止:
      - 发布
      - 写回订单约定日
      - 用失败试排冒充已可做
    禁止:
      - 写回订单约定日
      - 发布最快方案
    业务规则:
      - BR-27
      - BR-40
      - BR-47
    属于: F.l3.stg.fulfill
    撑住谁:
      - C.give_earliest_keep_due
      - F.l3.soft_conflicts
    绑哪个对象:
      - D.feasibility
    落在哪个文件:
      - db/earliest_plan.py
    出处:
      - 客户会议反馈/第二次演示后-完整升级方案.md
    对外怎么说:
      默认: 交期排不下时另给一份最快方案，标题写未改交期、未下发。
    说明: >
      二演后假设。锚只活在提案里，复用现有倒排，范围只含这一张订单。
      销售转述的事实来自这次试排。协商仍走交期变更审批。

  - 编号: F.l3.dispatch_daily_kit
    名称: 派工导出与按日领料
    套: 运营
    层: 节点
    状态: 假设
    命题: 已发布组日任务按客户表头导出；毛需求按日分摊，各日相加等于整单，先归到版。
    谁有权:
      - F.l2.cap_plan
    业务规则:
      - BR-01
      - BR-03
    属于: F.l3.stg.make
    撑住谁:
      - F.l1.board_is_meter
    绑哪个对象:
      - D.wo_task
      - D.bom
    落在哪个文件:
      - db/dispatch_export.py
    出处:
      - 客户会议反馈/派工领料与待排负荷-升级方案.md
      - 客户会议反馈/第二次演示后-完整升级方案.md
    对外怎么说:
      默认: 下到产线的是已发布计划；领料按日对得上整单毛需求。
    说明: >
      二演后假设。生产人员留空，系统只有计划人数，不写人员名单许可。
      未发布试排若导出，须标明不得下发。包材列对不上 BOM 就空着。

  - 编号: F.l3.unplaced_three_kinds
    名称: 对外未排汇总三类
    套: 运营
    层: 节点
    状态: 假设
    命题: 未排订单对外按已下单未排、在制在途未排、只排了一部分三类导出，不触发重排。
    别名: [未排汇总]
    谁有权:
      - F.l2.cap_plan
    这一步禁止:
      - 触发重排
      - 给待排单生成组日任务
    业务规则:
      - BR-40
    属于: F.l3.stg.fulfill
    撑住谁:
      - F.l3.fence_ripple
    绑哪个对象:
      - D.unplaced
    落在哪个文件:
      - db/plan_facts.py
    出处:
      - 客户会议反馈/第二次演示后-完整升级方案.md
      - 客户会议反馈/派工领料与待排负荷-升级方案.md
    对外怎么说:
      默认: 排不完的单分三类导出，看见剩下的料和工时，不要重排全厂。
    说明: >
      二演后假设。对内仍保留派工方案的判定格。待排缺口一次占库，各单短缺禁止相加。

  - 编号: F.l3.semi_progress_on_order
    名称: 半成品完成在订单上可见
    套: 运营
    层: 节点
    状态: 假设
    命题: 半成品报工达到计划量时，订单视角标完成数量；只记进度，不改约定日。
    谁有权:
      - F.l2.cap_dept2
      - F.l2.cap_plan
    禁止:
      - 写回订单约定日
    这一步禁止:
      - 写回订单约定日
    属于: F.l3.stg.make
    撑住谁:
      - F.l1.due_is_shared_reality
    绑哪个对象:
      - D.wo
    落在哪个文件:
      - db/schedule_progress.py
    出处:
      - 客户会议反馈/第二次演示后-完整升级方案.md
    对外怎么说:
      默认: 半成品做完了，订单上看见数量和颜色，日子仍是原来的约定。
    说明: >
      二演后假设。齐套仍读库存快照。原料到在制整段状态机未会签，不另建许可。

  - 编号: F.l3.headcount_to_capacity
    名称: 组人数折产能与加人缺口
    套: 运营
    层: 节点
    状态: 假设
    命题: 组在编折成当天产能；CREW 不再乘人数；排完给出加人缺口，试排不点名、不改交期。
    谁有权:
      - F.l2.cap_plan
    禁止:
      - CREW 再乘人数
      - 点名到人
      - 写回订单约定日
    这一步禁止:
      - 点名到人
      - 用剩余小时填另一品
      - 写回订单约定日
    业务规则:
      - BR-11
      - BR-12
      - BR-27
      - BR-40
    属于: F.l3.stg.schedule
    撑住谁:
      - F.l1.crew_in_sph
      - F.l3.sph_and_hours
    绑哪个对象:
      - D.headcount_gap
      - D.sph
    落在哪个文件:
      - packages/engine/headcount_gap.py
    出处:
      - 客户会议反馈/组人数折产能与加人缺口-升级方案.md
    对外怎么说:
      默认: 这一组有几个人、一天能做多少、还差几个人；不加姓名。
    说明: >
      二演后假设。单人口径按在编折人·时。多人配合禁止把加一人算成多一份产量。
      缺口不自动改计划。人员级排班不进本许可。

  - 编号: F.l3.sup.visit
    名称: 拜访记录支撑
    套: 运营
    层: 节点
    状态: 假设
    命题: 拜访只支撑需求确认；人确认后才进时间线，不是第二条价值流。
    属于: F.l3.stg.demand
    谁有权:
      - F.l2.sales_owns_promise
    这一步禁止:
      - 未确认草稿进时间线
      - 模型不经确认建客户或商机
      - 在拜访里改订单约定日
    禁止:
      - 写回订单约定日
    绑哪个对象:
      - D.visit
    落在哪个文件:
      - db/crm_sales.py
    出处:
      - 客户会议反馈/CRM销售过程-升级方案.md
      - 客户会议反馈/CRM销售移动端-优化方案.md
      - 客户会议反馈/第二次演示后-完整升级方案.md
    对外怎么说:
      默认: 说完一次拜访，确认后才进客户时间线。
    说明: >
      二演后支撑假设。像打样一样挂在需求环节下。销售怎么进、怎么看是菜单投影，
      不把手机页当成环节根。加急只打开最快方案，不改交期。

  - 编号: F.l3.sup.a_to_project
    名称: A 级转项目支撑
    套: 运营
    层: 节点
    状态: 假设
    命题: 销售总监手标 A 级并确认后进入项目大盘；加急只打开最快方案，不改约定日。
    属于: F.l3.stg.demand
    谁有权:
      - F.l2.sales_owns_promise
    禁止:
      - 写回订单约定日
      - 按金额自动标 A 级
    这一步禁止:
      - 写回订单约定日
      - 项目完成日写进订单约定日
    撑住谁:
      - C.give_earliest_keep_due
    绑哪个对象:
      - D.project
    落在哪个文件:
      - db/project_board.py
    出处:
      - 客户会议反馈/第二次演示后-完整升级方案.md
      - 客户会议反馈/CRM销售过程-升级方案.md
    对外怎么说:
      默认: A 级确认后进项目大盘；加急仍是未改交期的提案。
    说明: >
      二演后支撑假设。B/C 不进项目大盘。商机、拜访、项目用关联挂到订单，
      不做订单孩子。

  - 编号: F.l3.sup.finance_slice
    名称: 金额差与转化计数支撑
    套: 运营
    层: 节点
    状态: 假设
    命题: 履约关闭可看见金额差、商机转项目数、两个成功率与半成品完成数；公式未签字处记缺口。
    属于: F.l3.stg.fulfill
    出处:
      - 客户会议反馈/第二次演示后-完整升级方案.md
    对外怎么说:
      默认: 财务先看见差多少钱、转了多少项目、做成了多少半成品。
    说明: >
      二演后支撑假设。缺口。不另开价值流。不建工序归集、设备折旧或收益公式许可。

  - 编号: F.l3.sup.qc_on_board
    名称: 品控异常上生产看板
    套: 运营
    层: 节点
    状态: 假设
    命题: 品控登记的异常出现在生产看板；追溯只用已有工单倒推样本，不建真接口许可。
    属于: F.l3.stg.make
    出处:
      - 客户会议反馈/第二次演示后-完整升级方案.md
    对外怎么说:
      默认: 异常上看板；一批料用到哪些品，先看倒推样本。
    说明: >
      二演后支撑假设。缺口。金蝶真同步、分摊规则未确认，不建集成许可。
