论证:
  - 编号: A.keep_due_give_earliest
    名称: 交期锚推出只给最快日
    前提:
      - F.l1.due_is_shared_reality
      - F.l2.sales_owns_promise
      - F.l3.due_change_via_approval
      - F.l4.br27_no_write_due
    推出: C.give_earliest_keep_due
    击败: []
    对外怎么说:
      默认: 因为约定是共同实在，只有人能改，试算只给最快日，代码不得写回。
    说明: >
      这四条同时成立时，系统只给最快可交日、不改订单约定日。
      内部返工使主张不适用，整条论证不适用。

  - 编号: A.normalize_to_board
    名称: 版尺子推出先换算
    前提:
      - F.l1.board_is_meter
      - F.l3.normalize_to_board
    推出: C.normalize_to_board
    击败: []
    说明: >
      版是唯一尺子，所以计算前必须换算到版。

  - 编号: A.crew_no_double
    名称: CREW 口径不再乘
    前提:
      - F.l1.crew_in_sph
      - F.l3.sph_and_hours
    推出: C.crew_no_double_count
    击败: []
    说明: >
      人数已含在 SPH 内，组速不再乘人。
