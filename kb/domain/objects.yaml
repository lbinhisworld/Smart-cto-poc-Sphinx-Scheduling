卡片:
  - 编号: D.order
    名称: 销售订单
    套: 行业
    层: 对象
    状态: 已封印
    这句话: 销售订单是按单交付的承诺载体，不是车间计划表。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 一张销售订单对应客户、品项、数量和约定日。
    说明: >
      行业对象，不是流程。订单上有约定日、数量、单位等槽。
      运营节点谈改日、倒排、试算，都要绑到这张对象上的某个格子。

  - 编号: D.order.due_date
    名称: 订单上的客户约定日
    套: 行业
    层: 槽
    状态: 已封印
    这句话: 销售订单有一个客户约定日，它不是计划完工日。
    属于: D.order
    类型: 日期
    必须有: 是
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 订单上的交期是客户约定日。
    说明: >
      这是格子本身。后面主张、权责、改日、代码红线，谈的都是这一个槽。
      没有这个槽，不允许发明「交期」字段。

  - 编号: D.board
    名称: 版
    套: 行业
    层: 对象
    状态: 已封印
    这句话: 版是系统内部唯一计量单位，枚和盒必须先换成版再算工时。
    出处:
      - .cursorrules
      - 斯芬克斯-排程服务POC-开发需求规格.md
    对外怎么说:
      默认: 数量先归一到版，禁止拿枚或盒直接除 SPH。
    说明: >
      第一期只点名对象。BR-01 的运算细节挂在倒排节点，不写进这条对象卡。

  - 编号: D.group
    名称: 组
    套: 行业
    层: 对象
    状态: 已封印
    这句话: 组是手工组、模具组、浇注组；二部与一部用部门区分，不是第四个组码。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 任务按组×日一行。
    说明: >
      规格曾写 SEMI 组码，代码是三个组码加 SEMI_DEPT。漂移记在投影，不在这里改引擎。

  - 编号: D.sph
    名称: 标准小时产能
    套: 行业
    层: 对象
    状态: 已封印
    这句话: SPH 是值、口径、人数、单位四元组；CREW 口径下人数已含在值内。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: CREW 口径禁止再乘人数。
    说明: >
      第一期只点名。口径规则由对应节点和红线落实，不在对象卡里写算法。

  - 编号: D.wo
    名称: 工单
    套: 行业
    层: 对象
    状态: 已封印
    这句话: 工单分成品与半成品，先排成品再排半成品。
    出处:
      - packages/engine/models.py
    对外怎么说:
      默认: 成品变动要重建半成品工单。
    说明: >
      第一期只点名对象。先成品后半成品是节点规则（BR-34），不写进对象定义本身。
